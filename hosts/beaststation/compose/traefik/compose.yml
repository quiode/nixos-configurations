services:
  traefik:
    image: traefik:3
    container_name: traefik
    restart: always
    ports:
      - 80:80
      - 443:443
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - /ssd/critical/traefik/secrets.env
    environment:
      LEGO_DISABLE_CNAME_SUPPORT: "true"
      INFOMANIAK_PROPAGATION_TIMEOUT: 180
      INFOMANIAK_POLLING_INTERVAL: 10
    labels:
      traefik.http.middlewares.authentik.forwardauth.address: http://authentik:9000/outpost.goauthentik.io/auth/traefik
      traefik.http.middlewares.authentik.forwardauth.trustForwardHeader: true
      traefik.http.middlewares.authentik.forwardauth.maxResponseBodySize: 10485760 # 10MB in bytes
      traefik.http.middlewares.authentik.forwardauth.authResponseHeaders: X-authentik-username,X-authentik-groups,X-authentik-entitlements,X-authentik-email,X-authentik-name,X-authentik-uid,X-authentik-jwt,X-authentik-meta-jwks,X-authentik-meta-outpost,X-authentik-meta-provider,X-authentik-meta-app,X-authentik-meta-version
      traefik.http.routers.dashboard.middlewares: authentik@docker
      traefik.http.routers.dashboard.service: api@internal
      traefik.http.routers.dashboard.rule: Host(`traefik.dominik-schwaiger.ch`)
      traefik.http.routers.dashboard.tls: true
      traefik.http.routers.dashboard.tls.certresolver: letsencrypt
      traefik.enable: true
      # Wildcard certificate for *.dominik-schwaiger.ch
      traefik.tls.stores.default.defaultgeneratedcert.resolver: letsencrypt
      traefik.tls.stores.default.defaultgeneratedcert.domain.main: dominik-schwaiger.ch
      traefik.tls.stores.default.defaultgeneratedcert.domain.sans: "*.dominik-schwaiger.ch"
    mem_limit: 2g # FIXME: remove this and find out why traefik uses too much memory
    networks:
      - nextcloud
      - dominik-schwaiger
      - onlyoffice
      - vaultwarden
      - gitlab
      - jellyfin
      - qbittorrent
      - immich
      - ollama
      - home-assistant
      - matrix
      - esphome
      - authentik
      - seerr
      - radarr
      - sonarr
      - prowlarr
      - wireguard
      - atuin
      - monitoring

  ddns-updater:
    image: qmcgaw/ddns-updater:2
    restart: always
    container_name: ddns-updater
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /ssd/critical/ddns-updater/config.json:/updater/data/config.json:ro

networks:
  nextcloud:
    name: nextcloud

  dominik-schwaiger:
    name: dominik-schwaiger

  onlyoffice:
    name: onlyoffice

  vaultwarden:
    name: vaultwarden

  gitlab:
    name: gitlab

  jellyfin:
    name: jellyfin

  qbittorrent:
    name: qbittorrent

  immich:
    name: immich

  ollama:
    name: ollama

  home-assistant:
    name: home-assistant

  matrix:
    name: matrix

  esphome:
    name: esphome

  authentik:
    name: authentik

  seerr:
    name: seerr

  radarr:
    name: radarr

  sonarr:
    name: sonarr

  prowlarr:
    name: prowlarr

  wireguard:
    name: wireguard

  atuin:
    name: atuin

  monitoring:
    name: monitoring
